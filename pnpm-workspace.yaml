packages:
  - "apps/*"
  - "packages/*"
  - "firmware/setup_page"

# --- Supply-chain settings -------------------------------------------------
# https://pnpm.io/supply-chain-security
#
# Most of these match pnpm 11's own defaults. They are written down anyway so
# the protection does not silently disappear when someone installs with an
# older pnpm: before v11, `minimumReleaseAge` defaulted to 0.

# Wait 24 hours (1440 minutes) before installing a newly published version, so
# a compromised release has time to be reported and yanked first. Applies to
# transitive dependencies too.
minimumReleaseAge: 1440

# Fail the install if a package's trust level drops -- e.g. a release that
# previously shipped provenance or signatures suddenly ships without them,
# which is what a hijacked publishing account tends to look like.
trustPolicy: no-downgrade

# One lockfile entry trips `no-downgrade` today. It is signed by the
# registry but was published before its project adopted provenance
# attestations, so it looks like a downgrade against newer releases.
# Checked 2026-09-21: it is dev-only, not deprecated, and comes from the
# project's real repo. Drop it once its parent is upgraded past it.
# (undici-types@6.21.0 left with @types/node 22 on 2026-10-20, BAC-47.)
trustPolicyExclude:
  - "semver@6.3.1"         # via @babel/core, @babel/helper-compilation-targets

# Only our own direct dependencies may come from a git repo or a tarball URL.
# A transitive dependency must resolve from the registry or the workspace.
blockExoticSubdeps: true

# Dependencies may not run install scripts (preinstall/install/postinstall)
# unless they are listed here. Listing the exact versions, rather than a bare
# package name, means a new version of an already-approved package still has
# to be looked at by a human before its script may run.
#
# esbuild ships a postinstall that fetches its platform binary. 0.28.2 is
# Vite's, tsx's and Wrangler's, 0.25.12 is drizzle-kit's, and 0.18.20 arrives
# under drizzle-kit via the deprecated @esbuild-kit/esm-loader. drizzle-kit
# 0.31.11, the latest on 2026-10-20, still brings that last one in. The Event
# Service bundles with Rolldown, which needs no install script.
#
# workerd, the Workers runtime that Wrangler and the GeekyKey Service's tests
# run on, fetches its platform binary the same way. Each Wrangler upgrade
# brings a new workerd version, which someone has to look at and add here.
allowBuilds:
  # Firebase's web SDK: the screens depend on @firebase/app and @firebase/auth (FRO-59), which
  # bring @firebase/util. Its script writes the config it reads at start-up, and only when
  # FIREBASE_WEBAPP_CONFIG is set, which we never set: the published package already carries
  # the stub the SDK imports, and the screens pass the config to initializeApp themselves.
  # The script isn't needed, so it doesn't run.
  '@firebase/util@1.15.3': false
  "esbuild@0.28.2 || 0.25.12 || 0.18.20": true
  "workerd@1.20261012.1": true

# Two high advisories reach us through the Cloudflare tooling, which pins the
# vulnerable versions exactly, even in its latest releases (checked 2026-10-25).
# Both run only on our own machines and in CI (`wrangler dev`, the builds and
# the GeekyKey Service's tests), never in a deploy.
#
# undici 7.29.1 (GHSA-xjj6-f33q-929c) arrives through miniflare, under
# Wrangler and @cloudflare/vitest-plugin. 7.30.1 fixes it. zod 4.6.5
# (GHSA-mrhx-c7xc-m3w5) arrives through @cloudflare/vitest-plugin. 4.6.6 fixes
# it, and 4.6.7 is the one the rest of the repo already uses. Drop each line
# once miniflare and the plugin ask for a fixed version themselves.
overrides:
  "undici@7.29.1": "7.30.1"
  "@cloudflare/vitest-plugin>zod": "4.6.7"

# Advisories `pnpm audit` skips. CI fails on high or critical ones only, but an
# entry here keeps the local report clean, so a new advisory stands out. Each
# entry says why it can't reach us; drop it once the package leaves the tree.
auditConfig:
  ignoreGhsas:
    # esbuild 0.18.20's dev server answers any website's requests. It arrives
    # through @esbuild-kit/esm-loader, which drizzle-kit 0.31.11 lists as a
    # dependency but never loads: its code requires its own esbuild 0.25.12
    # and tsx (checked 2026-10-20). So esbuild 0.18.20 is installed, never run.
    - GHSA-67mh-4wv8-2f99
