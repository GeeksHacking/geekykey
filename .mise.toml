# Tool versions and task shortcuts for the whole monorepo.
# this file is the source of truth for tool versions. `packageManager` in
# package.json must match the pnpm pin here.
#
#   mise install            install the pinned tools
#   mise run <task>         run a task with those tools on PATH, even if the
#                           shell is not activated
#   mise tasks              list tasks

[tools]
node = "22.23.3"
pnpm = "12.5.1"
deno = "2.9.6"

[tasks.install]
description = "Install every workspace package (run from anywhere)"
run = "pnpm install"

# Frontend

[tasks."dev:frontend"]
description = "Vite dev server on http://localhost:5173"
run = "pnpm dev:frontend"

[tasks."test:frontend"]
description = "Frontend unit tests (Vitest)"
run = "pnpm test:frontend"

[tasks."build:frontend"]
description = "Typecheck, then production build to apps/frontend/dist"
run = "pnpm build:frontend"

[tasks."format:frontend"]
description = "Format the frontend code in place (oxfmt)"
run = "pnpm format:frontend"

# Updates site. Astro sends anonymous usage data unless told not to.

[tasks."dev:updates"]
description = "Updates site dev server on http://localhost:4321"
run = "pnpm dev:updates"
env = { ASTRO_TELEMETRY_DISABLED = "1" }

[tasks."build:updates"]
description = "Build the updates site to apps/updates/dist"
run = "pnpm build:updates"
env = { ASTRO_TELEMETRY_DISABLED = "1" }

# Backend

[tasks."dev:backend"]
description = "Hono on Deno with file watching, on http://localhost:8000"
run = "pnpm dev:backend"

[tasks."test:backend"]
description = "Backend tests (deno test)"
run = "pnpm test:backend"

[tasks."deps:backend"]
description = "Re-resolve apps/backend/deno.lock, skipping npm releases under 24h old"
dir = "apps/backend"
run = "deno task deps:lock"

[tasks."seed:backend"]
description = "Create a dev station and participant in the local database"
dir = "apps/backend"
run = "deno task seed"
