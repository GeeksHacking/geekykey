# Tool versions and task shortcuts for the whole monorepo.
# this file is the source of truth for tool versions. `packageManager` in
# package.json must match the pnpm pin here, and apps/event-service/Dockerfile
# pins the same Node and pnpm.
#
#   mise install            install the pinned tools
#   mise run <task>         run a task with those tools on PATH, even if the
#                           shell is not activated
#   mise tasks              list tasks

[tools]
node = "24.21.0"
pnpm = "12.5.1"

[tasks.install]
description = "Install every workspace package (run from anywhere)"
run = "pnpm install"

[tasks.dev]
description = "Both services and both sets of screens: the GeekyKey Service on 8000, the Event Service on 8001, the Event screens on 5173 and the GeekyKey screens on 5174"
run = "pnpm dev"

# Frontend

[tasks."dev:frontend"]
description = "Vite dev server on http://localhost:5173"
run = "pnpm dev:frontend"

[tasks."test:frontend"]
description = "Frontend unit tests (Vitest)"
run = "pnpm test:frontend"

[tasks."build:frontend"]
description = "Typecheck, then production build to apps/frontend/dist"
run = "pnpm build:frontend"

[tasks."format:frontend"]
description = "Format the frontend code in place (oxfmt)"
run = "pnpm format:frontend"

# GeekyKey web

[tasks."dev:geekykey-web"]
description = "Vite dev server on http://localhost:5174"
run = "pnpm dev:geekykey-web"

[tasks."test:geekykey-web"]
description = "GeekyKey web unit tests (Vitest)"
run = "pnpm test:geekykey-web"

[tasks."build:geekykey-web"]
description = "Typecheck, then production build to apps/geekykey-web/dist"
run = "pnpm build:geekykey-web"

[tasks."format:geekykey-web"]
description = "Format the GeekyKey web code in place (oxfmt)"
run = "pnpm format:geekykey-web"

# Updates site. Astro sends anonymous usage data unless told not to.

[tasks."dev:updates"]
description = "Updates site dev server on http://localhost:4321"
run = "pnpm dev:updates"
env = { ASTRO_TELEMETRY_DISABLED = "1" }

[tasks."build:updates"]
description = "Build the updates site to apps/updates/dist"
run = "pnpm build:updates"
env = { ASTRO_TELEMETRY_DISABLED = "1" }

# Event Service

[tasks."dev:event-service"]
description = "The Event Service on Node on http://localhost:8001, reloading on save, with dev-login on"
run = "pnpm dev:event-service"

[tasks."test:event-service"]
description = "Event Service tests (Vitest on Node) against geekykey_test, run once"
run = "pnpm test:event-service"

[tasks."format:event-service"]
description = "Format the Event Service code in place (oxfmt)"
run = "pnpm format:event-service"

# GeekyKey Service

[tasks."dev:geekykey-service"]
description = "The GeekyKey Service in wrangler dev on http://localhost:8000, with dev-login on"
run = "pnpm dev:geekykey-service"

[tasks."test:geekykey-service"]
description = "GeekyKey Service tests (Vitest in workerd), run once"
run = "pnpm test:geekykey-service"

[tasks."format:geekykey-service"]
description = "Format the GeekyKey Service code in place (oxfmt)"
run = "pnpm format:geekykey-service"

[tasks."test:smoke"]
description = "End-to-end smoke test: a station's tap and heartbeat through both services to geekykey_test"
run = "pnpm test:smoke"

# TiDB in Docker for apps/event-service, from the root compose.yaml. Docker
# must be running first.

[tasks."db:up"]
description = "Start TiDB on 127.0.0.1:4000, then create and migrate geekykey_dev and geekykey_test"
run = "pnpm db:up"

[tasks."db:reset"]
description = "Throw away all TiDB data, then start it again with empty, migrated databases"
run = "pnpm db:reset"

[tasks."db:migrate"]
description = "Apply new migrations from apps/event-service/drizzle to geekykey_dev and geekykey_test"
run = "pnpm db:migrate"

[tasks.seed]
description = "Add a dev station, participant and organizer to geekykey_dev"
run = "pnpm seed"

[tasks."db:down"]
description = "Stop TiDB, keeping its data for the next db:up"
run = "pnpm db:down"
