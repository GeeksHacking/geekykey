name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every step inherits GITHUB_TOKEN, including anything a dependency decides to
# run. CI only needs to read the repo, so drop the write permissions it is
# given by default.
permissions:
  contents: read

# A second push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA rather than a tag, because a tag can
      # be moved to point at different code and a SHA cannot. The trailing
      # comment records which release each SHA is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise installs node and pnpm at the versions pinned in .mise.toml, so
      # CI runs the same toolchain we do and those version numbers live in
      # exactly one place. It verifies GitHub artifact attestations on what it
      # downloads.
      #
      # This deliberately does not use corepack. pnpm 12 ships its CLI as a
      # per-platform native binary (the @pnpm/exe.* packages) and corepack --
      # including the current 0.36.0 -- still looks for the old bin/pnpm.cjs,
      # so `corepack enable` cannot launch the pnpm this repo pins.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.12
        env:
          # Only so mise is not rate-limited fetching tools from GitHub. The
          # workflow permissions above make this token read-only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --frozen-lockfile fails rather than rewriting the lockfile, so nothing
      # reaches the build that is not already in the reviewed pnpm-lock.yaml.
      # It also runs pnpm's supply-chain policy check across every entry:
      # release age, trust downgrades, integrity, and exotic sources. The
      # policy itself lives in pnpm-workspace.yaml.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Neither of these is part of the typecheck or the tests, so without them
      # lint errors and unformatted files pile up unnoticed. `build` runs the typecheck.
      - name: Lint
        run: pnpm --filter @geekykey/frontend lint

      - name: Format
        run: pnpm --filter @geekykey/frontend format:check

      - name: Test
        run: pnpm test:frontend

      # `build` runs the typecheck first.
      - name: Build
        run: pnpm build:frontend

  geekykey-web:
    name: GeekyKey web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # Neither of these is part of the typecheck or the tests, so without them
      # lint errors and unformatted files pile up unnoticed. `build` runs the typecheck.
      - name: Lint
        run: pnpm --filter @geekykey/geekykey-web lint

      - name: Format
        run: pnpm --filter @geekykey/geekykey-web format:check

      - name: Test
        run: pnpm test:geekykey-web

      - name: Build
        run: pnpm build:geekykey-web

  # The Worker at key-api. Nothing here deploys it: Workers Builds does, on
  # Cloudflare, once Julian connects it (infra/README.md). Its hand-off
  # package is checked in the Event Service's job.
  geekykey-service:
    name: GeekyKey Service
    runs-on: ubuntu-latest
    env:
      # Wrangler sends anonymous usage data unless told not to.
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # Neither of these is part of the typecheck or the tests, so without them
      # lint errors and unformatted files pile up unnoticed.
      - name: Lint
        run: pnpm --filter @geekykey/geekykey-service lint

      - name: Format
        run: pnpm --filter @geekykey/geekykey-service format:check

      # `wrangler types` first writes the Worker's types from wrangler.jsonc.
      - name: Typecheck
        run: pnpm --filter @geekykey/geekykey-service typecheck

      # Inside workerd, with the Event Service and the claims stand-in faked,
      # so no database is needed.
      - name: Test
        run: pnpm test:geekykey-service

      # Bundles the Worker and checks wrangler.jsonc as a deploy would,
      # without deploying: what Workers Builds runs, short of uploading.
      - name: Build
        run: pnpm --filter @geekykey/geekykey-service check:build

  # The steps are in event-service.yml, which deploy.yml runs too.
  event-service:
    name: Event Service
    uses: ./.github/workflows/event-service.yml

  # Both services together: the Event Service on Node and the Worker in
  # `wrangler dev`, with a station's tap and heartbeat sent through the
  # Worker and read back from the database. It runs on every pull request,
  # whichever app it touches, since a change on either side can break the
  # hand-off between them. apps/event-service/scripts/smoke-test.ts has the
  # checks.
  smoke-test:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Wrangler sends anonymous usage data unless told not to.
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # TiDB in Docker from the root compose.yaml, with geekykey_test created
      # and migrated, the same way as on a laptop.
      - name: Start TiDB
        run: pnpm db:up

      - name: Smoke test
        run: pnpm test:smoke

  updates:
    name: Updates site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # The build is also the site's content check: it stops on a bad entry
      # file name, a banned dash, a changelog line out of order, or a leftover
      # TODO( marker. Running it here catches those on the PR that adds them.
      - name: Build
        run: pnpm build:updates
        env:
          # Astro sends anonymous usage data unless told not to.
          ASTRO_TELEMETRY_DISABLED: "1"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `pnpm audit` reads pnpm-lock.yaml directly, so this job does not need
      # to install anything.
      #
      # This fails the build on high and critical advisories only. Moderates
      # are printed but do not block, because one is currently unavoidable:
      # esbuild@0.18.20 reaches us through drizzle-kit's deprecated
      # @esbuild-kit/esm-loader, drizzle-kit is already on its latest release,
      # and the advisory only affects esbuild's dev server, which nothing here
      # runs. Read the printed output rather than trusting the exit code alone.
      - name: Audit
        run: pnpm audit --audit-level=high
