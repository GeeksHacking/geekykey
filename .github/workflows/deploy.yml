name: Deploy

# Deploys the backend to Google Cloud Run, as the Event Service, once the
# backend's checks pass:
#
# - every push to main deploys production, event-service;
# - running it by hand (Actions > Deploy > Run workflow), from any branch,
#   deploys staging, event-service-staging.
#
# Where it deploys, as whom, and with which settings and secret versions is in
# infra/. How those were set up, and what to do by hand (the warm instance,
# rolling back), is in infra/README.md.
#
# GitHub holds no secret for this. The job signs in to Google Cloud with the
# token GitHub gives every run, which Google trusts only from this repo, and
# for production only from main (infra/README.md, step 6).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml

  deploy:
    name: Deploy
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job ask GitHub for the token it signs in to Google Cloud with.
      id-token: write
    env:
      TARGET: ${{ github.event_name == 'push' && 'production' || 'staging' }}
    # One deploy at a time to each service, and never cancelled halfway, since
    # it migrates the database. A run that arrives meanwhile waits its turn.
    # The group repeats TARGET's expression because `env` can't be read here.
    concurrency:
      group: deploy-${{ github.event_name == 'push' && 'production' || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Everything after this reads the project's names and this target's
      # service, deploy account and secret versions from infra/. Comments and
      # blank lines are left out, since GitHub can't read them.
      - name: Read infra/project.env and infra/${{ env.TARGET }}/deploy.env
        run: grep -h -v -e '^#' -e '^$' infra/project.env "infra/$TARGET/deploy.env" >> "$GITHUB_ENV"

      # A token GitHub signs for this run is swapped for a Google one that
      # acts as the deploy account. It lasts an hour and is never stored.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The same image CI builds, tagged with this commit. It's deployed by its
      # digest, which names exactly these bytes, so a later push to the same
      # tag can't change what runs.
      - name: Build the image and push it to Artifact Registry
        run: |
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet
          docker build --file apps/backend/Dockerfile --tag "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          echo "IMAGE_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile --filter @geekykey/backend

      # Before the deploy, so the new code never meets an old schema. The
      # version still running meets the new schema for a moment, which is why
      # every migration must work with it. --production means GeeksHacking's
      # cluster; the login decides which database, geekykey or
      # geekykey_staging. MIGRATION_SECRET is secret:version.
      - name: Migrate the database
        run: |
          url=$(gcloud secrets versions access "${MIGRATION_SECRET##*:}" --secret="${MIGRATION_SECRET%:*}")
          echo "::add-mask::$url"
          TIDB_MIGRATION_URL="$url" pnpm --filter @geekykey/backend db:migrate --production

      # --env-vars-file and --set-secrets replace every setting and secret the
      # service had, so it runs with exactly what infra/ says. Its size and
      # instance limits aren't touched: they were set once (infra/README.md,
      # step 5), and the warm instance is switched by hand. Then all traffic
      # goes to the new revision, which also ends a rollback once its revert
      # is merged.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --region="$REGION" \
            --image="$IMAGE_DIGEST" \
            --env-vars-file="infra/$TARGET/settings.env" \
            --set-secrets="$SECRETS" \
            --quiet
          gcloud run services update-traffic "$SERVICE" --region="$REGION" --to-latest --quiet
