<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="GeekyKey: tap your token, collect stamps, earn points." />
    <title>GeekyKey</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f8ed8'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fafafa'/%3E%3C/svg%3E" />
    <script>
      // Runs before paint so the page never flashes the wrong theme.
      // System preference wins; dark is the fallback when the browser does not say "light".
      (function () {
        try {
          var stored = localStorage.getItem("gk-theme");
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          var dark = stored === "dark" || (stored !== "light" && !light);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="min-h-[100dvh] bg-background font-sans text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
