<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="GeekyKey: claim tokens, see your stations, and manage your keys."
    />
    <title>GeekyKey</title>
    <link rel="icon" type="image/svg+xml" href="/brand/gh-logo-secondary.svg" />
    <script>
      // Runs before paint so the page never flashes the wrong theme.
      // System preference wins; dark is the fallback when the browser does not say "light".
      (function () {
        try {
          var stored = localStorage.getItem("gk-theme");
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          var dark = stored === "dark" || (stored !== "light" && !light);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="min-h-[100dvh] bg-background font-sans text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
