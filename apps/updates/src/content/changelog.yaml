- id: ci-wider
  date: 2026-09-26
  area: tooling
  change: >-
    Every pull request also checks the backend's lint and formatting, and builds this site.

- id: backend-split-planned
  date: 2026-09-28
  area: research
  change: >-
    The hosting plan now splits today's backend in two: the GeekyKey Service checks each
    station and passes every tap on as a user and a station, and the showcase's Event Service
    keeps the taps, stamps and points. For now both share one TiDB database.

- id: database-setup-planned
  date: 2026-09-28
  area: research
  change: >-
    The hosting plan now says how the services use TiDB: through Cloudflare's Hyperdrive, with
    a login that can only read and write data, and database changes run as their own step
    before each deploy. Hyperdrive stays provisional until a deployed service reaches TiDB
    through it, and a test on a throwaway database confirms TiDB does what the plan relies on.

- id: dev-test-ci-planned
  date: 2026-09-28
  area: research
  change: >-
    The hosting plan now says how laptops and CI run the backend: Deno leaves, Cloudflare's own
    runtime runs it locally and in tests, and a local copy of TiDB in Docker, the same version as
    the real database, stands in for it so the tests check what production runs. That copy is
    light enough for an 8 GB laptop: measured on one, it is an 843 MB download once, ready about
    1.5 seconds after starting, and under 500 MB of memory in use.

- id: token-id-planned
  date: 2026-09-28
  area: research
  change: >-
    The hosting plan now says what identifies a token: its chip's built-in ID, which the chip
    also fills into the web address written on every token, so every token is written the same
    way and only we can rewrite it. The trade-off we accept: someone could type another token's
    address and claim it before its holder does, and the real holder can then get it released.

- id: stations-planned
  date: 2026-09-28
  area: research
  change: >-
    The hosting plan now says how reader stations talk to the GeekyKey Service: over HTTPS at
    an address of their own, sending the same taps as today, with a check-in every minute that
    keeps the connection open and sets the station's clock. If the event's service is down, the
    station keeps its taps and sends them again later, and each result shows for about two
    seconds, amber for a repeat tap that does not count, with no pause between people. The
    trade-offs we accept: a tap at a station not yet linked to an event is turned away rather
    than saved, and stations trust a fixed list of the certificate authorities Cloudflare uses,
    so they need new firmware if Cloudflare ever adds one.

- id: event-service-handoff-planned
  date: 2026-09-28
  area: research
  change: >-
    The hosting plan now says how the GeekyKey Service hands taps to an event's service: one web
    request, the same for our showcase and for any other team's event, checked by a key the two
    services share. Only GeeksHacking admins link a station to an event, adding a new event's
    service is a reviewed change, and a station in an event but in none of its games now says so
    on its screen instead of looking like a counted tap. The trade-offs we accept: organizers ask
    an admin to move a station, a service slower than three seconds makes the station ask for a
    second tap even when the first one counted, and a station unlinked by mistake loses the taps
    it had saved.

- id: screens-and-login-planned
  date: 2026-09-28
  area: research
  change: >-
    The hosting plan now says which screens belong to which service, and how each knows who is
    logged in. The passport and organizer screens stay with the showcase's Event Service, on an
    address of its own still being agreed with GeeksHacking. The page a phone opens when it taps
    a token, a page listing your tokens where a lost one can be released, and the admins' station
    screens become a second small app on geekykey.geekshacking.com. Each service logs people in
    through the GeeksHacking Portal itself. A phone that can't read NFC can still claim a token by
    typing its code, and if a reader fails, an organizer can log a tap by scanning the
    participant's Portal QR code. The trade-offs we accept: someone who uses both services logs
    in twice, there is a second app to build and look after, and adding an organizer is a
    reviewed change rather than a button.

- id: ab-export-planned
  date: 2026-09-28
  area: research
  change: >-
    The hosting plan now says what the organizers' CSV export, the data for the A/B test, keeps
    once the backend splits in two. Joshua, who writes the report, confirmed the analysis needs
    neither each token's hardware ID nor the taps by tokens nobody has claimed yet. So the export
    keeps one row per tap the event stores, with who tapped, at which station and when, and
    nothing about unclaimed tokens is saved. The trade-off we accept: the data can't show how
    many people tapped before claiming their token, so a confusing claim step would only show up
    in the survey or by watching people at the event.

- id: deploys-planned
  date: 2026-09-28
  area: research
  change: >-
    The hosting plan now says how GeekyKey gets deployed and where its passwords and keys live,
    agreed with Julian and Qing Guan at GeeksHacking. Cloudflare builds each part straight from
    our code once it has passed its checks, and database changes are applied separately, before
    the code that needs them is merged. The code will go public, so GitHub can enforce those
    checks. There is one live copy, with no separate test copy and no preview of each change.
    Every merge goes live, except from the evening before the showcase until it ends, and a bad
    release is undone one service at a time. Keys are kept only in Cloudflare, set by Adam, with
    no spare copy. We start on Cloudflare's free plan, measure real use on the first deploy, and
    decide on the paid plan by 11 November, a week before the showcase. The stations' address
    becomes geekykey-api.geekshacking.com, on Qing Guan's advice. The trade-offs we accept: we
    test on the live system and clear the test data before the doors open, a database change
    takes an extra step before merging, and the free plan may not last a busy day, which we will
    only know once we measure.

- id: token-claims-planned
  date: 2026-09-28
  area: research
  change: >-
    The hosting plan now says how GeekyKey will work with the token features Qing Guan has
    started building into the GeeksHacking Portal, which will eventually record whose each token
    is. The Portal currently answers one request at a time, and every tap at a station would wait
    on it. So for the showcase we propose keeping our own record of who claimed each token, and
    moving it into the Portal straight after the event, if Julian agrees. We also listed what
    GeekyKey needs from the Portal: finding tokens by their hardware ID, looking up many at once,
    claiming, releasing, and listing a person's tokens. Only each token's current owner is kept,
    and a GeeksHacking admin can release a token someone else claimed by tapping it with their
    phone. The trade-offs we accept: the Portal version waits until after the showcase, nobody
    can see who owned a token before, and people who never open the passport appear without a
    name in the organizers' records.

- id: backups-planned
  date: 2026-09-29
  area: research
  change: >-
    The hosting plan now says how GeekyKey's data is backed up, recovered on the day and wiped of
    test data before the showcase. TiDB's free backup runs once a day at a time it picks and is
    kept for only a day, so we take copies of our own: a few megabytes, made in seconds before
    every database change, before the test data is cleared and at the end of the day, and kept
    on Adam's laptop because they hold who tapped where. On the day nobody changes the database
    structure, only Adam changes data, with Ethan checking first, and each recorded tap is also
    written to the logs so taps lost to a restore can be put back. The test data is cleared the
    evening before, and the morning check uses unclaimed tokens so it stores nothing. The
    trade-offs we accept: recovery depends on Adam being reachable, test taps and claims made
    after the evening clear would count, and clearing every claim assumes participants claim
    their tokens at check-in, which is still being discussed.

- id: public-addresses-planned
  date: 2026-09-29
  area: research
  change: >-
    The hosting plan now says how GeekyKey's public addresses are protected from abuse without
    shutting out the reader stations. The limits live in our own code and count per station, per
    logged-in person and per event service, never per internet address, because a whole venue of
    phones and stations can share one. A station may send 60 requests a minute, about twice what
    a busy queue needs. A person may make 60, of which 20 can be token lookups or claims: enough
    for the check-in desk, too few for a script guessing token codes. Each person can hold at
    most three tokens, stations retry at most once a minute while the service is down, and
    requests with made-up station keys are turned away before they reach the database.
    GeeksHacking admins can switch off a station that goes missing, and its key is replaced
    before it is used again. The trade-offs we accept: on Cloudflare's free plan, a flood from
    many addresses could still use up the day's allowance, which now counts toward the paid-plan
    decision; a new or changed station key takes up to a minute to work; and a Cloudflare setting
    that keeps security challenges away from the stations waits until we next talk to Qing Guan.

- id: event-day-monitoring-planned
  date: 2026-09-29
  area: research
  change: >-
    The hosting plan now says how we notice trouble at the showcase and who deals with it.
    Cloudflare's and TiDB's free plans offer no uptime checks or error alerts we could use, and
    the team is in the room all day, so people watch instead of waiting for an alert. Adam
    watches the services, Zi Tao the reader stations and Ethan the screens, and Adam or Ethan is
    always at the desk. The organizers' station screen puts any station that needs attention at
    the top in red: one that has gone offline, can't get its taps through, isn't in the passport
    yet, or, if Zi Tao's firmware can report it, has a card reader that stopped working. A
    one-page sheet at the desk lists each likely fault, what it looks like, who fixes it and who
    to call at GeeksHacking. We will rehearse the whole day on the live system by 7 November,
    in time for the paid-plan decision. The trade-offs we accept: before the rehearsal, a fault
    is noticed only if someone happens to be using the system; a fault waits if Adam and Ethan
    both leave the desk without handing over; and on the free plan, a sudden rush could use up
    the day's allowance between two hourly checks.

- id: token-writer
  date: 2026-09-29
  area: firmware
  change: >-
    A first version of the token writer is in the code. Run on a spare reader station, it writes
    the same web address onto every token, switches on the chip feature that fills in each token's
    own ID when a phone reads it, and protects the token with one password so only we can rewrite
    it. It then reads the token back to check all of that, including that the password works.

- id: move-order-planned
  date: 2026-09-29
  area: research
  change: >-
    The hosting plan is finished, and Adam has approved the choices it had to make on its own.
    It sets out the move in eight steps. Today's backend first moves unchanged onto Cloudflare
    and TiDB and goes live. Then it is split into the GeekyKey Service and the showcase's Event
    Service, and logging in through the GeeksHacking Portal, the new features and getting ready
    for the day come after that. The rehearsal on the live system is due by 7 November, and the
    showcase is on 18 November. The trade-offs we accept: new endpoints wait until the split, so
    the screens that need them stay on demo data for longer; until GeeksHacking protects our main
    branch, Adam deploys and changes the live database by hand from his laptop; and the plan
    doesn't wait for the Sprint 2 A/B test, which isn't confirmed yet, so booking it early could
    pull the Portal login forward.

- id: api-agreement-v0-2
  date: 2026-09-29
  area: backend
  change: >-
    The API agreement is rewritten for the two services, as a draft of version 0.2. Each endpoint
    now names the service that owns it and the step of the plan that builds it, pairing a token
    becomes claiming it, with at most three per person, and two new answers let a station say it
    isn't in an event, or is in one but in none of its games. The trade-off we accept: just this
    once, the rewrite removes things the web app already reads, such as the list of tokens on the
    dashboard, which the agreement otherwise never allows. It is safe only because nothing live
    depends on them yet.

- id: station-saved-taps
  date: 2026-09-29
  area: firmware
  change: >-
    The reader station's code now follows the hosting plan's rules for saved taps. It keeps up to
    100 taps, in memory that survives a power cut, until the backend answers them, sends the saved
    ones together at most once a minute, and sends a new tap at once along with them. Any answer
    removes a tap, even one the station doesn't know yet, and the screen and light show the new
    answers for a station outside an event or its games. Its own notes say it hasn't yet been
    compiled or tried on a station.

- id: frontend-api-v0-2
  date: 2026-09-29
  area: frontend
  change: >-
    The web app is ready for version 0.2 of the API agreement. It has a plain message for each new
    error, such as a token someone else has claimed, the three-token limit or too many tries, and it
    recognises the new tap answers for a station outside an event or its games. Its calls are also
    grouped by the service each one will go to after the split, though every screen still talks to
    today's backend.

- id: move-step-1-planned
  date: 2026-09-29
  area: backend
  change: >-
    The first step of the move is planned as six tasks in the team's Linear, each saying which
    must be finished first: today's backend runs on Cloudflare's own runtime against a local copy
    of TiDB, with nothing changing for the web app or the reader stations, and Deno leaves. The
    riskiest part comes first: a small test proving Cloudflare's test tools can reach the local
    database, with a fallback ready if they can't. The trade-offs we accept: the six tasks share
    one branch, where the automatic checks fail partway and pass again only once Deno is gone, so
    the step reaches the main code in one piece; and the one real change in behaviour, a database
    lock that makes one station's requests take turns so a resent tap can't count twice or beat
    the cooldown, is built together with moving the tap code rather than on its own, so that task
    is marked for a closer review.

- id: move-step-1-proof
  date: 2026-09-30
  area: backend
  change: >-
    The first proof of the move passes. On a laptop, the backend now runs on Cloudflare's own
    runtime and reaches a local copy of TiDB through the same kind of connection it will use in
    production, and its tests run on that runtime too. So far the new version answers only the
    health check; the other endpoints move over in the next tasks. The trade-offs we accept:
    Cloudflare's test tool loads the database driver wrongly in two small ways, so our test
    settings work around both until Cloudflare fixes them, and working on the backend now means
    installing Docker.

- id: move-step-1-tables
  date: 2026-09-30
  area: backend
  change: >-
    Today's four tables now live in the local copy of TiDB, made by one fresh set of database
    changes that replaces the SQLite ones, and the seed fills it with the usual station, participant
    and organizer. Every test now starts from empty tables with the same small set of test data.
    The trade-offs we accept: times stay stored as text, as before, so nothing that reads them
    changes but the database can't fill them in itself; two lines of the database changes are
    edited by hand, because our database tool can't express them; and on the move's branch the
    old Deno server no longer starts, since its database driver is gone.

- id: move-step-1-taps
  date: 2026-09-30
  area: backend
  change: >-
    Taps sent the way a station sends them now reach the backend on Cloudflare's own runtime and
    are stored in the local copy of TiDB, with the same requests and answers as before; a real
    station hasn't tried it yet. One station's requests now take turns through a lock in the
    database instead of a queue inside the server, so a resent tap still comes back as a duplicate,
    and two quick taps by one participant still meet the cooldown, even when the requests land on
    different copies of the backend. A test showed TiDB needs one more step than planned: after
    waiting for the lock, a request must also read with a lock, or it still misses the taps the
    request before it stored. The trade-offs we accept: those reads lock rows no other request
    needs, which costs nothing while one station's requests take turns anyway; and the dev server
    now listens on the whole local network, not only the laptop, because stations call it by the
    laptop's name.

- id: move-step-1-dashboard
  date: 2026-09-30
  area: backend
  change: >-
    The participant dashboard and passport now work against the backend on Cloudflare's own
    runtime and the local copy of TiDB, with the same requests and answers as before and no change
    to the website. Signed in through the development sign-in, the seeded participant sees their
    points, stamps and recent taps; the seeded organizer can sign in and out too, though their own
    screens still show demo data until those endpoints exist. The backend now reads its settings
    once, when it starts, so the development sign-in is left out of production altogether rather
    than switched off. The trade-offs we accept: this relies on Cloudflare handing the backend its
    secrets at start-up, which its documentation says it does but only the first deploy will
    confirm.

- id: tracker-showcase-plan
  date: 2026-09-30
  area: admin
  change: >-
    The team's issue tracker is now organised around the showcase on 18 Nov: one goal with five
    projects (the move to Cloudflare, the screens, the stations, going public, and the report),
    each with a lead, and the move's eight steps are laid out as milestones with what "done" means
    for each and who they wait on. The station and going public work now has its own tickets with
    checks to pass, stale tickets from June are closed, and the old Software team is folded into
    Frontend, leaving one team each for the backend, the screens and the hardware. The trade-offs
    we accept: the milestones repeat what the plan says, so the two have to be kept in step.

- id: move-step-1-no-deno
  date: 2026-09-30
  area: tooling
  change: >-
    The backend no longer uses Deno: it is now an ordinary package like the website, checked by
    the same linter, formatter and type checker, and one command starts it with the development
    sign-in on, with no settings file to copy first. Every pull request now also starts a copy of
    TiDB and runs the backend's tests against it, builds the backend the way Cloudflare will
    deploy it, and fails if a change to the database's tables has no migration with it. The
    trade-offs we accept: the backend's code was reformatted once to match the website's style,
    so many older lines show a change in the history; and downloading the database adds time to
    every run of the checks.

- id: move-step-1-readme
  date: 2026-09-30
  area: tooling
  change: >-
    The README now explains the backend as it runs after the move, on Cloudflare's own runtime
    with a local copy of TiDB, so a teammate can go from a fresh copy of the code to a stored tap
    by following it alone. It covers installing Docker, starting the database, adding the
    practice station and users, starting the backend and sending a practice tap. It also shows
    how to change a setting on a laptop without changing what gets deployed, and says to quit
    Docker when not working on the backend, since it can use 4 GiB of memory.

- id: station-queue-fixed
  date: 2026-10-01
  area: firmware
  change: >-
    The first test of the reader station against the new backend found that none of its taps were
    stored. The station saved each tap in one place and looked for it in another, so it threw the
    tap away and sent the backend an empty list. That is fixed, and a real tag tapped on the
    station now shows up in the database, the first tap accepted and the quick repeats held back
    by the cooldown. The station also now prints the backend's answer, so a wrong station key
    shows up straight away. A gap we found but haven't fixed: the station doesn't say when a
    saved tap was made, so taps sent together all look as if they happened at the same moment.

- id: move-step-2-tickets
  date: 2026-10-01
  area: admin
  change: >-
    The first deploy is now planned as seven tickets. GeeksHacking creates the Cloudflare Workers
    and the stations' address, we set up the production database with two logins that can do no
    more than they need, and the backend goes live at that address and stores a practice tap,
    including one held back by the cooldown, which is the first time the cooldown's lock runs
    through Cloudflare's database connection pooling. After that we check that Cloudflare's logs
    never show a station's key, write down what a tap costs against the free plan, explain
    deploying in the README, and have a real station tap the live backend. The trade-offs we
    accept: until the main branch is protected, Adam deploys by hand from his laptop, so every
    deploy waits on one person.

- id: screens-tickets-v02
  date: 2026-10-01
  area: admin
  change: >-
    The screens' work for the showcase is now 27 small tickets, in two groups. One brings the
    current screens in line with the agreed contract: pairing leaves them, the tap log and export
    lose token IDs, and organizers get the new station board and passport settings. The other
    builds the new GeekyKey screens: the page a phone opens when it taps a token, My tokens, and
    the station admin screens. Each ticket builds one change against demo data, so the screens
    can go ahead before the backend's endpoints exist. Ethan leads them, and Joshua moves to the
    ideas and the report full time. The trade-offs we accept: small tickets mean more of them to
    track, and some, such as the one that removes station creation from the current screens, can
    only start once the new screens have taken that job over.

- id: hosting-without-infra-access
  date: 2026-10-01
  area: backend
  change: >-
    GeeksHacking now runs the live backend, and the team gets no access to their Cloudflare
    account, which Julian says is normal in most companies. Julian sets up each part and connects
    it to our code, so every merge to the main branch goes live. The stations' address becomes
    key-api.geekshacking.com, tokens will carry key.geekshacking.com, and the showcase's event
    service moves to a repo of its own when the backend splits. Alongside it, with Julian's
    agreement, Adam runs a test copy on his own Cloudflare account against a separate test
    database, to try each deploy before it goes live. The trade-offs we accept: we can't read the
    live logs or undo a release ourselves, only revert our change or ask Julian, and the test copy
    is one more thing to keep in step.

- id: station-runs-unwatched
  date: 2026-10-02
  area: firmware
  change: >-
    The reader station now sees tags after every start. Before, about half of its starts left the
    card reader switched off, so the station showed it was ready but ignored every tag, which
    looked like loose wiring. It also finds the laptop again after the laptop's address changes,
    such as when a phone hotspot restarts, and no longer stalls when plugged into a laptop's USB
    with no serial monitor open.

- id: production-database-ready
  date: 2026-10-02
  area: backend
  change: >-
    The live database is now set up on GeeksHacking's TiDB, with today's tables and two logins
    that can do no more than they need. The backend's login can read and write rows but can't
    change tables, and a second login, kept only on Adam's laptop, applies changes to the tables.
    A test station and a real test token are in it, so the first deploy can try every tap result.
    The trade-offs we accept: the backend login's password is saved nowhere, so whoever connects
    the live backend gets a new one when they need it, and until the main branch is protected
    only Adam can change the tables.

- id: hyperdrive-cannot-reach-tidb
  date: 2026-10-02
  area: backend
  change: >-
    The test copy's own database is set up on GeeksHacking's TiDB, with two logins that can't
    touch the live one. Connecting it showed that Hyperdrive, the Cloudflare service the plan used
    to link the backend to TiDB, can't sign in to TiDB Cloud: TiDB asks every client to sign in a
    second time, a step Hyperdrive doesn't support, and the live backend would hit the same wall.
    The backend will connect to TiDB another way, chosen at the team meeting.

- id: event-service-moves-to-cloud-run
  date: 2026-10-02
  area: backend
  change: >-
    After the mentor meeting, the backend plan changes shape. The Event Service, which keeps the
    event's data, will run on Google Cloud Run next to TiDB, where it can keep its database
    connections open. The GeekyKey Service, which stations and tokens talk to, stays on Cloudflare's
    free plan and keeps no database of its own. A short round of planning now settles where token
    owners and stations live, whether a station waits for its result, and how the Event Service is
    deployed. The trade-off we accept: two hosting platforms to set up and watch instead of one.

- id: stations-belong-to-the-event-service
  date: 2026-10-05
  area: backend
  change: >-
    Stations now belong to the event they're used at. Each Event Service creates its own stations
    and gives out their keys, and the event's organizers add, disable and replace keys on their
    station board. The GeekyKey Service still turns away an unknown station key straight away. It
    checks keys against a list each Event Service shares and refreshes every minute, so a fake key
    never reaches the database. A station sends its taps to whichever event listed its key. The
    trade-off we accept: moving a station to another event means flashing it again with a new key,
    which we'll check with Julian on 8 Oct.

- id: token-owners-until-the-portal
  date: 2026-10-05
  area: backend
  change: >-
    Until the Portal can store who owns each token, the showcase keeps that list on our own Cloud
    Run server, next to the Event Service but separate from it. It answers the same questions the
    Portal will, so after 18 Nov we copy the claims across and switch with no change to stations or
    screens. Tapping your own token on a phone now shows a button into the event, and GeeksHacking
    staff can still release a lost token someone else has found. The trade-off we accept: each
    station request makes two calls to Cloud Run until the switch, which we'll check with Julian on
    8 Oct.

- id: stations-wait-for-their-result
  date: 2026-10-06
  area: backend
  change: >-
    A station keeps waiting for each tap's result, so it can still show amber when a tap is too soon
    and tell an unclaimed token to claim on a phone. Nothing is lost when the event's server is slow:
    the station already saves every tap first and sends it again later, showing "Will send later".
    The station's heartbeat no longer waits at all, and the server is kept running on event days so
    the first tap of the morning isn't slow. The trade-off we accept: when the server is slow, the
    person tapping sees "Will send later" instead of their result.

- id: station-faster-results
  date: 2026-10-06
  area: firmware
  change: >-
    The reader station shows each tap's result for 2 seconds with its light on, then goes back to
    Ready, so the next person can tap after about 2 seconds instead of more than 4. It no longer
    reads the text on a token, only its ID, and a token tapped again straight after its result is
    skipped for 3 seconds rather than sent again. It also starts without WiFi and saves taps until it
    connects. It builds, but hasn't yet been tried on a station.

- id: tailwind-4
  date: 2026-10-06
  area: tooling
  change: >-
    The web app, the GeekyKey screens and this site now use Tailwind CSS 4, so the dependency
    audit on every pull request passes again. Tailwind 3 relied on a package with a security
    advisory and no fixed version. Each screen was compared with the old build in both themes, on
    a phone and a laptop, and looks the same. The trade-offs we accept: we upgraded three apps
    instead of ignoring the advisory, and the web app downloads about 2.5 kB more styling.

- id: worker-cache-planned
  date: 2026-10-07
  area: research
  change: >-
    The hosting plan now says what the GeekyKey Service keeps on hand. It keeps each event's list
    of stations in memory, fetched from the event and refreshed in the background once a minute,
    and keeps the last good list when the event doesn't answer. It doesn't keep who owns each token
    before the showcase, so a token claimed a moment ago counts at once. After the showcase, when
    owners move to the Portal, it keeps claimed tokens' owners for up to five minutes in Cloudflare's
    free cache. The trade-offs we accept: the first tap after a quiet spell may wait while the list
    is fetched, and after the switch a token passed to someone else could count for its old owner
    for a few minutes.

- id: event-service-cloud-run-planned
  date: 2026-10-07
  area: research
  change: >-
    The hosting plan now says how the event's server runs on Google Cloud Run, the same way
    GeeksHacking already runs the Portal. It runs on Node, after Bun and Deno ran our backend
    unchanged and no faster, and the whole repo moves to Node 24 first. Every change merged to
    main updates the database, then deploys, with no password kept in GitHub, and a staging copy
    sits beside it. The trade-offs we accept: Cloudflare's protections don't cover the server's
    address, so our own limits do, and one copy of the server is kept running only on event days,
    so the first request on any other day is slower.

- id: move-redrawn-planned
  date: 2026-10-07
  area: research
  change: >-
    The hosting plan now has its steps redrawn for two platforms. Today's backend first moves
    unchanged to Google Cloud Run and goes live there. Then the GeekyKey Service is cut out as its
    own Cloudflare Worker with no database, and the stations switch to it. Each event registers its
    own stations, so organizers add, rekey and disable them on the station board, and GeeksHacking
    staff only release lost tokens. The trade-offs we accept: every station is reflashed once when
    the GeekyKey Service is cut out, and five choices wait on the meeting with GeeksHacking on 8
    October.

- id: node-24
  date: 2026-10-07
  area: tooling
  change: >-
    Every app, every laptop and CI run on Node 24, which is supported until April 2028 and is the
    Node the event's server will run on Google Cloud Run.

- id: backend-on-node
  date: 2026-10-07
  area: backend
  change: >-
    The backend runs as a Node server, built into the container image that Google Cloud Run will
    run, and answers stations and screens exactly as before. It checks that an idle database
    connection still works before reusing it, since Cloud Run pauses the server between requests,
    and CI checks on every pull request that the image builds and starts.

- id: cloud-setup-by-hand-planned
  date: 2026-10-08
  area: research
  change: >-
    The hosting plan now says GeeksHacking creates our own Google Cloud project on its billing
    account, and we set up the event's server there by hand, writing down every command, rather
    than as infrastructure as code. Each merge to main still deploys it automatically, with no key
    stored in GitHub. The trade-offs we accept: the setup can drift from what is written down until
    it becomes code, and switching on the warm server for event days is a command someone has to
    remember to run.

- id: firebase-login-planned
  date: 2026-10-08
  area: research
  change: >-
    The hosting plan now says people log in at the showcase through Firebase, with Google or with
    their GeeksHacking account, instead of through the GeeksHacking Portal, so the showcase's
    visitors never end up in GeeksHacking's user list, and the login no longer waits on the
    Portal's team. The trade-offs we accept: claims made at the showcase are deleted with its data
    rather than moved to the Portal afterwards, and whether the GeekyKey Service can check a login
    within the free plan is still to be tried.

- id: station-setup-mode-planned
  date: 2026-10-08
  area: research
  change: >-
    The hosting plan now says a station takes a new server address, key or Wi-Fi network through a
    setup mode, from a terminal or a browser page, instead of being reflashed, for a new venue's
    Wi-Fi, moving it to another event, or moving it to the GeekyKey Service's own address. GeeksHacking also agreed to keep the showcase's
    claims on our server until after the showcase. The trade-offs we accept: the station firmware
    gains a feature to build and try before the GeekyKey Service is cut out.

- id: showcase-freeze-planned
  date: 2026-10-08
  area: research
  change: >-
    The hosting plan now says the backend takes no new features from 11 November, a week before
    the showcase, and nothing at all merges after 16 November, so nothing deploys the night
    before. Before the rehearsal, a copy of the backend is put under more load than the showcase
    expects. The trade-offs we accept: anything merged between the rehearsal on 7 November and the
    freeze reaches the showcase without a rehearsal of its own.

- id: backend-oxlint
  date: 2026-10-09
  area: tooling
  change: >-
    The backend is linted by Oxlint instead of ESLint, in under a second, with three fewer
    packages to install. The two sets of screens stay on ESLint, because Oxlint lacks some of the
    React hooks rules they use, and Ethan decides whether they move. The trade-offs we accept:
    two linters in one repo for now, and Oxlint's default rules are close to ESLint's but not the
    same set.

- id: backend-rolldown
  date: 2026-10-09
  area: tooling
  change: >-
    The backend's server is bundled by Rolldown, the bundler inside Vite, instead of esbuild. The
    file Google Cloud Run runs is a third smaller, because Rolldown leaves out more unused code,
    and it answers stations and screens exactly as before. The trade-offs we accept: esbuild is
    still installed for other tools, and an error inside the database library is traced to its
    JavaScript rather than its TypeScript.

- id: event-service-cloud-run-setup
  date: 2026-10-09
  area: backend
  change: >-
    The Event Service has its two copies on Google Cloud Run, production and staging, made by hand
    from a runbook that lists every command, and a workflow that migrates and deploys production
    on every merge to main, and staging when run by hand, with no key kept in GitHub. The first
    deploy went out on the same day, and production now answers at its Google address; its own
    address, event-api.geekshacking.com, waits on Julian mapping it.

- id: event-service-staging-live
  date: 2026-10-10
  area: backend
  change: >-
    Staging is live: the Event Service's staging copy runs on Google Cloud Run against its own
    database, and a test station's taps come back accepted, duplicate, cooldown and unknown token
    as they should, all stored in staging's database and none in production's. A deploy with a
    missing secret fails in the workflow and leaves the running copy answering.

- id: login-after-the-showcase
  date: 2026-10-10
  area: backend
  change: >-
    After the showcase, both services log people in through the GeeksHacking Portal, and the
    showcase's Firebase login is turned off once its users are deleted. Firebase is for the
    showcase's visitors only, because the Portal's tag APIs know Portal users, not Firebase ones.
    The trade-offs we accept: each service's login is built twice, once for Firebase now and once
    for the Portal after the showcase, though only the sign-in step changes.

- id: firebase-login-check
  date: 2026-10-10
  area: backend
  change: >-
    Google sign-in works against our Firebase project, and a Cloudflare Worker checks the login it
    gives in about 1 ms of computing time, well inside the free plan's 10 ms, so both services
    keep the planned login: the screens sign in with Firebase and send the result to their own
    service, which checks it and sets its own cookie. The trade-offs we accept: every visitor
    signs in with a Google account for now, and GeeksHacking's own login waits on Mr Pang.

- id: geekshacking-login-first
  date: 2026-10-10
  area: backend
  change: >-
    GeeksHacking's own login is being added to the showcase beside Google sign-in, before Mr Pang
    is asked whether the showcase offers it, so it's ready if he agrees. The trade-offs we accept:
    asking the Portal's team for a client that may end up unused, and a small charge for each
    GeeksHacking member who signs in beyond 49 a month.

- id: api-agreement-firebase-login
  date: 2026-10-10
  area: backend
  change: >-
    Version 0.4 of the API agreement is agreed with the screens' team: both services log people in
    by checking the sign-in Firebase gives the screens, with Google or GeeksHacking's login, and
    user IDs at the showcase are Firebase's. The trade-offs we accept: logging in through the
    Portal waits until after the showcase, and a user whose sign-in gives no name shows as
    "GeeksHacking member" until we learn whether GeeksHacking's login sends one.

- id: staging-logs-clean
  date: 2026-10-11
  area: backend
  change: >-
    Staging's logs hold no station key and no login cookie, checked by sending made-up ones and
    searching every log line for them, and no address the Event Service answers carries a secret.
    Production gets the same search at its first tap.

- id: cold-start-measured
  date: 2026-10-11
  area: backend
  change: >-
    An idle Event Service answers its first tap within about 2.6 seconds, so the GeekyKey
    Service's 4-second deadline stays, and Cloud Run keeps its start-up boost. The trade-offs we
    accept: the boost won by less than the spread between rounds, and our timings come from 13
    rounds on staging, not from a real station.

- id: event-service-live
  date: 2026-10-12
  area: backend
  change: >-
    The Event Service is live at event-api.geekshacking.com: a test station's taps to it come back
    unknown token, accepted, duplicate and cooldown as they should, and are stored in production's
    database, not staging's, and production's logs hold no station key or login cookie.

- id: event-api-behind-cloudflare
  date: 2026-10-12
  area: backend
  change: >-
    The Event Service's address stays behind Cloudflare's proxy, as GeeksHacking set it up,
    because a request sent the way a station sends one passes through it untouched. The
    trade-offs we accept: Cloudflare answers with its own certificate rather than Google's, the
    Event Service's logs show Cloudflare's addresses instead of each caller's, and Google's
    certificate renews from behind the proxy, so we check in December that it did.

- id: station-https
  date: 2026-10-12
  area: firmware
  change: >-
    The station now talks HTTPS to a full server address, checking the server's certificate
    against 14 trusted root certificates, and sends its key over plain HTTP only to a laptop on
    the same network. A real station's taps reached staging and then production, and were stored
    in each. The trade-offs we accept: if Cloudflare starts using a new certificate authority,
    every station needs new firmware.

- id: readme-deploying
  date: 2026-10-12
  area: tooling
  change: >-
    The README now explains how we deploy, so someone who wasn't there for the first deploy can
    deploy from it, and GeeksHacking can take the code over from it after the showcase. It says
    where each part runs, how a push to the main branch deploys production and a run by hand
    deploys staging, how to roll back, where every credential is kept without giving any, and
    the team's eight rules, from the freeze before the showcase to who may change data on the
    day, and marks as coming the parts that don't exist yet, such as database copies.

- id: tidb-first-numbers
  date: 2026-10-12
  area: backend
  change: >-
    The database's first two days of real use, from staging's and production's first taps to
    the station's, took a few tens of thousands of the 50 million free Request Units a month,
    with no failed query and no transaction kept waiting. The trade-offs we accept: the numbers
    are too small to say what a showcase day will use, so the rehearsal measures it.

- id: checkpoint-3-tickets
  date: 2026-10-12
  area: admin
  change: >-
    The next step of the move is planned as nine tickets: inside the one server, the GeekyKey
    Service, the Event Service and the claims stand-in reach each other only through the requests
    they will send once they run apart. A station's tap gets its owner from the claims stand-in
    and is handed to the Event Service, its key is checked against the stations the Event Service
    has registered, and a new heartbeat sets the station's clock and shows it online. The
    trade-offs we accept: each table change takes two deploys, since an old column goes only once
    nothing running uses it.

- id: backend-split-inside
  date: 2026-10-12
  area: backend
  change: >-
    The backend's code is now in three parts, the GeekyKey Service's side, the Event Service's
    side and the claims stand-in, along the line the two services will be cut apart at, and every
    line it logs is one JSON object with a fixed name that the showcase's saved queries can count,
    holding no station key, login cookie or person's name.

- id: claim-check-order
  date: 2026-10-13
  area: frontend
  change: >-
    Claiming a token now checks the 3-token limit before whether someone else owns it, in the API
    agreement and in the screens' mock, so someone already holding 3 is told to release one. When
    someone else got a token first, the token page says so, and shows underneath whether anyone holds it now.

- id: geekshacking-brand
  date: 2026-10-14
  area: frontend
  change: >-
    The Event screens and the GeekyKey screens now use the GeeksHacking branding kit: its logos,
    its yellow and greys, the Open Sans font and filled icons, with the current page marked in
    yellow in the navigation. The trade-offs we accept: the kit has no dark theme, no status
    colours and no font for numbers, and its secondary grey is too faint to read on a light
    page, so there the screens keep their own choice or use a colour worked out from the kit's.

- id: event-service-and-claims-keys
  date: 2026-10-14
  area: backend
  change: >-
    The backend on Google Cloud, in production and in staging, has the two keys the GeekyKey
    Service will show when it hands a tap to the Event Service and when it asks the claims
    stand-in who owns a token. Each is random and was generated straight into Google's Secret
    Manager, so nobody keeps a copy, and only its own service is given access to it. Each
    service now keeps its keys, session secret and database login in one secret, at Julian's
    suggestion, so Secret Manager stores four versions instead of ten.

- id: owners-from-the-claims-stand-in
  date: 2026-10-14
  area: backend
  change: >-
    A station's tap now gets its token's owner by asking the claims stand-in, with its key,
    within a 4-second deadline, as it will once the two services run apart. A tap by a token
    nobody has claimed is answered and logged but no longer stored, and when the owners can't be
    found in time the station keeps its taps and sends them again later. The Event Service no
    longer sends a user's tokens with their passport, since tokens belong to the GeekyKey Service.

- id: taps-handed-off-to-the-event-side
  date: 2026-10-14
  area: backend
  change: >-
    A station's taps now reach the Event Service as users, never as tokens: the GeekyKey side
    hands each station's claimed taps over in one request, with the Event Service key, and the
    Event side stores each one with its user ID and writes a log line for it. When the Event
    Service doesn't answer properly within the 4 seconds, the station keeps its taps and sends
    them again later. The request's shapes live in a shared package, which also writes them out
    as JSON Schema for other teams building an Event Service.

- id: station-keys-checked-against-registered-stations
  date: 2026-10-14
  area: backend
  change: >-
    A station's key is now checked against the stations each Event Service has registered. The
    GeekyKey side asks each Event Service for its list, with the Event Service key, keeps the
    lists in memory, and asks again at most once a minute, even for a list that didn't come back.
    It no longer reads the stations table, so it is ready to run without a database. A disabled
    station drops off its list, and its key is refused within a minute. Organizers can't disable
    a station yet; that comes with the station board. When an Event Service's list can't be had,
    the station keeps its taps and sends them again later instead of being told its key is wrong.

- id: heartbeat-sets-station-clock
  date: 2026-10-15
  area: backend
  change: >-
    A station can now send a heartbeat, which gives it the time to set its clock by. Once the
    GeekyKey side has checked the station's key, it passes on what the station says about itself
    to the Event Service: its firmware version, how many taps it has saved, and whether its
    reader works. If that fails, the station still gets the time, so it gets it even while the
    Event Service is down. The Event Service keeps these on the station's row, with when it last heard
    from the station, for the station board to show. The station firmware's side comes next.

- id: passport-has-its-own-stations
  date: 2026-10-15
  area: backend
  change: >-
    The passport now keeps its own list of stations, each with the name, location and points it
    shows, apart from the stations themselves. Only stations on that list are stamp slots, in the
    order they joined it, so a station added later goes last. The Event Service still keeps a tap
    at a station that isn't on the list, but it earns nothing, and the station shows "Not in a
    game". Every
    station that existed already joined the list, so their taps count as before. Who is an
    organizer now comes from a list in the Event Service's settings, not from a user's record,
    and the lists for production and staging start empty.

- id: station-sends-a-heartbeat
  date: 2026-10-15
  area: firmware
  change: >-
    The station now sends a heartbeat when it starts and every minute after, with its firmware
    version, how many taps it has saved, and whether its card reader answers. It sets its clock
    from the time in each answer, so once the first heartbeat has gone through, every tap carries
    the time it was made, even one saved offline and sent later. Saved taps go just before each
    heartbeat. When the reader stops answering, the screen shows "Reader error" and "Tell
    organizer" with the red light on until it answers again.

- id: old-columns-dropped-and-areas-kept-apart
  date: 2026-10-15
  area: backend
  change: >-
    The database drops the columns nothing reads any more, such as a tap's token ID and a
    station's passport name, and deletes old test taps with no user, while every station keeps
    its ID and key. A lint check stops the GeekyKey side, the Event side and the claims stand-in
    from importing each other's code, so they reach each other only through their requests.

- id: checkpoint-3-passed-on-production
  date: 2026-10-15
  area: backend
  change: >-
    Production passes the third step of the move. Inside the one server, a test station's taps go
    from the GeekyKey side to the claims stand-in and the Event side, and come back unknown token,
    accepted, duplicate and cooldown as they should. Only the accepted and cooldown taps are
    stored, under the participant's user ID with no token ID. A heartbeat gets the server's time
    back and records when the station was last heard from and how it is doing. Every log line is
    one JSON object with a fixed name, and none holds a station key, a cookie or a name.

- id: checkpoint-4-tickets
  date: 2026-10-16
  area: admin
  change: >-
    The next step of the move is planned as eight backend tickets and one for the screens. The
    GeekyKey Service leaves the one server for its own Cloudflare Worker at key-api, which calls
    the Event Service over HTTPS, every station moves to it, and a check on every pull request
    sends a station's tap through both services to the database. Julian copies the two keys the
    Worker needs from Google Cloud into it himself, so no key is sent in a message, and the Worker
    gets no staging copy unless the stress test needs one. Whether the Event Service moves to its
    own repo now or after the showcase is a question for Julian. The trade-offs we accept: the
    Worker is tried only on a laptop and in CI before production, and the Event Service keeps its
    copy of the station endpoints until the last station has moved.

- id: event-service-repo-after-showcase
  date: 2026-10-16
  area: admin
  change: >-
    The Event Service stays in this repo until after the showcase on 18 Nov, as Julian agreed.
    The next step of the move splits the folders inside the one repo, so the sign-in to Google
    Cloud, the shared hand-off schemas and the smoke test don't change before the backend freeze
    on 11 Nov.

- id: geekykey-service-worker
  date: 2026-10-16
  area: backend
  change: >-
    On a laptop, the GeekyKey Service now runs as its own Cloudflare Worker, which takes a
    station's taps and heartbeats and passes them to the Event Service over HTTP, with the same
    answers as before. CI checks the Worker on every pull request, and nothing deploys it until
    Julian connects it at key-api.

- id: smoke-test-every-pull-request
  date: 2026-10-17
  area: tooling
  change: >-
    Every pull request now starts both services together in CI and sends a station's taps and a
    heartbeat through the GeekyKey Service's Worker to the Event Service. The check then reads the
    database: the Event Service must store a claimed token's tap under its owner's user ID, store
    nothing for an unclaimed token, and record that the heartbeat came. When the two services
    hold different keys, the check fails and names the step that broke.

- id: worker-build-rehearsed
  date: 2026-10-18
  area: tooling
  change: >-
    The GeekyKey Service's Worker builds on Cloudflare with the settings Julian will use, tried
    first on Adam's own account: it installs with the repo's pnpm and Node, and uploads in 30
    seconds. The runbook now has the dashboard's real labels and says how the first build starts.

- id: geekykey-service-on-cloudflare
  date: 2026-10-19
  area: backend
  change: >-
    The GeekyKey Service now runs on Cloudflare at key-api.geekshacking.com, and Workers Builds
    deploys it from main. Julian set its three secrets and connected the build. The first build
    failed because the secrets were in the build's own settings, where only the build can read
    them. Once he moved them onto the Worker, the deploy passed.

- id: station-setup-mode
  date: 2026-10-19
  area: firmware
  change: >-
    A station now takes a new server address, station key or Wi-Fi network over its USB cable,
    typed into a terminal, with no reflash. A replaced key keeps the station's saved taps, which
    count once they are sent. A key from another event sends them first and clears the rest, so
    no tap from one event reaches another. The trade-offs we accept: anyone with a cable can
    change a station, which they could already do by reading its flash, and the station board
    shows a station turned elsewhere as offline.

- id: checkpoint-4-proof-on-production
  date: 2026-10-19
  area: backend
  change: >-
    On production, a test station's taps go through the GeekyKey Service at key-api to Cloud Run
    and come back unknown token, accepted, duplicate and cooldown, and a heartbeat records when
    the station was last heard from. In the Worker's logs Cloudflare masks the station key, and
    the keys the Worker sends to Cloud Run never appear. A batch of 500 taps used 18 ms of CPU,
    over the free plan's 10 ms a request. Zod's checks were most of it, so a change in review runs
    a plain check first. On a test copy of the Worker it took the median batch from 12 to 15 ms
    down to 6 or 7 ms.

- id: stations-on-key-api
  date: 2026-10-20
  area: firmware
  change: >-
    The main station sends its taps and heartbeats to the GeekyKey Service at key-api. It moved
    there through the setup mode, without a reflash, and its first tap was stored on production.
    No station still calls the Event Service's own address, so we can remove the Event Service's
    copy of the station endpoints.

- id: station-setup-page
  date: 2026-10-20
  area: firmware
  change: >-
    A browser page now sets up a station over its USB cable, for anyone who doesn't use a
    terminal. In Chrome or Edge it sends a new server address, key or Wi-Fi network, then reports
    whether the station joined the network and whether the server accepted its key. It never shows
    the key or the password, and only the person can drop taps a station couldn't send. The
    trade-offs we accept: it's one file to download, with no hosted link or login yet, and it
    reads the station's printed lines word for word, so a reworded line fails its tests until the
    page changes too.

- id: dependencies-refreshed
  date: 2026-10-20
  area: tooling
  change: >-
    Every app's dependencies are on their latest patch releases, and the lockfile records what
    pnpm resolves today, so renaming an app's folder changes one line of it instead of 258. The
    updates site no longer pulls in a TOML parser with a slow-parsing advisory, and the audit
    passes with one advisory set aside: an old esbuild that drizzle-kit installs but never runs.
    The trade-offs we accept: a large lockfile change reviewed on its own, and TypeScript 7 waits
    until the screens' linter supports it, so the whole repo moves to it at once.

- id: checkpoint-4-done
  date: 2026-10-20
  area: backend
  change: >-
    Checkpoint 4 is done. Every station now calls only the GeekyKey Service at key-api, and the
    station endpoints are gone from the Event Service on Cloud Run, which answers a station's tap
    with not found. Cloud Run keeps the event's games, the hand-offs and the claims stand-in, and
    its settings drop the ones only the GeekyKey side read.

- id: handoff-answer-schema-bounds
  date: 2026-10-20
  area: backend
  change: >-
    The JSON Schema we publish for other teams' Event Services now refuses a hand-off answer with
    no results, more than 500, or a tap ID longer than 128 characters, as the API agreement
    already said. Our own Event Service never sent such an answer, so nothing changes for ours.
    The trade-offs we accept: a schema still can't say that each result matches its tap, so that
    rule stays in the agreement's words and in the GeekyKey Service's own check.

- id: event-service-no-store
  date: 2026-10-20
  area: backend
  change: >-
    Every answer from the Event Service now tells caches not to keep it, including the list of
    stations with their key hashes and the claims stand-in's answers about who owns which token.
    Before, only the screens' paths carried that rule. The trade-offs we accept: the rule covers
    every path rather than a named few, so a route added later can't be missed, at the cost of
    never caching anything the Event Service sends.

- id: unknown-station-key-refreshes
  date: 2026-10-20
  area: backend
  change: >-
    A station key the GeekyKey Service doesn't know now makes it ask the Event Services for their
    stations again, once its copy is a minute old. A new station's key then works within about a
    minute even when no other station is tapping. The trade-offs we accept: junk keys can make it
    call each Event Service once a minute, where before they could only do that while an Event
    Service's list was missing.

- id: updates-branding-kit
  date: 2026-10-20
  area: admin
  change: >-
    This site now uses the GeeksHacking branding kit, as the screens do: its greys and yellow,
    the Open Sans font and its logo. The schedule shows the showcase on 18 November, not 17.

- id: event-service-firebase-login
  date: 2026-10-20
  area: backend
  change: >-
    The Event Service now logs a user in with the ID token Firebase gives the screens, checking it
    against Google's keys and saving the user's name. The GeekyKey Service's login will use the
    same check, and nothing calls it on production until the screens deploy.

- id: screens-workers
  date: 2026-10-20
  area: frontend
  change: >-
    Each set of screens has its own Cloudflare Worker, ready for Julian to deploy on
    event.geekshacking.com and key.geekshacking.com. It serves the screens, so reloading a page such as a token's /t/ link works, and passes
    the browser's calls under /api and /auth to its own service, so the login cookie belongs to
    the screens' address. If the service doesn't answer, the Worker sends the new error
    service_unavailable instead of Cloudflare's own error page, so the screens can show a message.

- id: showcase-guests-decided
  date: 2026-10-21
  area: backend
  change: >-
    Decided how parents and mentors start collecting stamps in the showcase's afternoon: they can
    continue as a guest on the token page, with one tap and no account, and the token page's
    button opens their passport already logged in. Anyone can also choose the name the event shows.
    The API agreement's version 0.5 has the details, waiting for Ethan's review.

- id: geekykey-service-firebase-login
  date: 2026-10-21
  area: backend
  change: >-
    The GeekyKey Service now logs a user in with a Firebase ID token, with the same check as the
    Event Service's. Its /me tells the GeekyKey screens who is logged in, with their tokens and the
    showcase's address for its button. Nothing calls either on production until the screens deploy.

- id: screens-firebase-login
  date: 2026-10-21
  area: frontend
  change: >-
    Both sets of screens sign in with Firebase's web SDK: "Continue with Google", and
    "Continue with GeeksHacking" once that provider is set up in Firebase. That provider
    is not set up yet, so the second button is hidden, and nothing calls the login on
    production until the screens deploy.

- id: event-service-display-names
  date: 2026-10-21
  area: backend
  change: >-
    A user can now choose the name the event shows on the passport, the scan log and the export,
    and logging in again never replaces it. Someone whose login has no name, such as a guest, is
    called Guest until they choose one, and the Event Service tells the passport to ask them.

- id: login-links
  date: 2026-10-21
  area: backend
  change: >-
    The showcase's buttons on the token page and My tokens can now open the passport logged in as
    the same user, guest or Google, through a login link that works once for a minute. Nothing uses
    it on production until the screens deploy.

- id: tap-time-before-cloud-run
  date: 2026-10-21
  area: research
  change: >-
    Timings on production from two networks and a real station show that Cloud Run spends about
    0.1 seconds on a tap, and the rest depends on which Cloudflare data centre answers it: under
    0.7 seconds through Singapore, and up to 3.7 through Paris or Marseille. A Worker setting that
    runs the GeekyKey Service near Cloud Run may fix the slow ones, and is open for a decision.

- id: screens-deployed
  date: 2026-10-21
  area: frontend
  change: >-
    Both sets of screens are live: the Event screens at event.geekshacking.com and the GeekyKey
    screens at key.geekshacking.com, each built from main by Cloudflare. Both show the login
    screen. The Event screens ask the real Event Service who is logged in. The GeekyKey screens
    still run on mock data until their calls go live.

- id: screens-log-in-with-google
  date: 2026-10-21
  area: frontend
  change: >-
    Both sets of screens log in with a Google account through the real services, checked on a
    laptop against both services, and My tokens lists the tokens the GeekyKey Service says you
    hold. Claiming and releasing a token still run on sample data until checkpoint 6, so the
    token page says so and My tokens offers no Release yet.

- id: checkpoint-5-phone-check
  date: 2026-10-22
  area: backend
  change: >-
    On production, logging in with Google and logging out work on both sets of screens, and a tap
    at the main station shows up as a stamp on a phone's passport.
    In a test on Adam's own Cloudflare account, Cloudflare's logs hid our login cookies, so the logs
    can stay on. An open passport uses at least 360 Workers requests an hour, out of the free plan's
    100,000 a day. Checkpoint 5 stays open for a guest's run from the token page to the passport,
    which waits on screens Ethan's team is still building.

- id: event-screens-login-link
  date: 2026-10-22
  area: frontend
  change: >-
    The Event screens log someone in from a login link, so a guest or a Google user who opens the
    passport from the token page or My tokens arrives logged in as the same user. A link that has
    expired says so and leaves any earlier login as it was. Nothing opens a link on production
    until the token page and My tokens get their event buttons.

- id: geekykey-screens-continue-as-guest
  date: 2026-10-22
  area: frontend
  change: >-
    The GeekyKey screens' login offers "Continue as guest", so a parent or mentor whose phone isn't
    signed in to Google logs in with one tap and no account. When someone's 12-hour login runs out,
    the screens log them in again without showing the login page, so a guest stays the same guest
    rather than starting over as a new one who owns no tokens. The Event screens don't offer a
    guest login.

- id: geekykey-screens-warn-a-guest-before-sign-out
  date: 2026-10-22
  area: frontend
  change: >-
    A guest who taps "Sign out" on the GeekyKey screens is asked first, because signing in as a
    guest again makes a new guest, and the old guest's tokens and stamps stay with a login nobody
    can get back. The warning says to ask at the desk, where a GeekyKey admin releases the tokens
    so they can be claimed again. A Google or GeeksHacking user signs out without being asked. The
    trade-offs we accept: the stamps of a guest who signs out are lost, and a guest who signs out anyway still
    needs a helper to get their tokens back.

- id: event-screens-name-prompt
  date: 2026-10-22
  area: frontend
  change: >-
    The passport asks a participant with no name of their own "What should we call you?", with Save
    and Skip, above the stamps rather than in front of them. Skipping keeps "Guest" and the passport
    doesn't ask again until a new tab. Anyone can change their name later from the passport,
    including a Google user who would rather not show their full Google name. A name must be 1 to
    30 characters once trimmed, and the screens check that before sending it.

- id: geekykey-screens-open-each-event
  date: 2026-10-22
  area: frontend
  change: >-
    My tokens and the token page carry a button for each event, and the button opens that event's
    screens as the same user. A guest who claimed a token reaches the passport without logging in
    a second time, and a Google user lands there without signing in again.

- id: checkpoint-5-guest-claim-moves-to-checkpoint-6
  date: 2026-10-22
  area: backend
  change: >-
    Checkpoint 5's guest run no longer waits on claiming, which checkpoint 6 builds. The guest gets
    the test token through a direct write, as the Google user did, so checkpoint 5 now needs only
    that phone run. A guest claiming a token from the token page moved to checkpoint 6's checks.
    The trade-offs we accept: checkpoint 5 passes before a guest has claimed a token through the
    screens.

- id: checkpoint-5-done
  date: 2026-10-22
  area: backend
  change: >-
    Checkpoint 5 is done. On a phone, a guest on the GeekyKey screens tapped a token at the main
    station, opened the passport from "Open Capstone Showcase" without logging in again, and saw
    the stamp. A Google user reached the passport the same way. Both sets of screens now log people
    in on production, and checkpoint 6, claiming and releasing tokens, comes next.

- id: checkpoint-6-tickets
  date: 2026-10-22
  area: admin
  change: >-
    Checkpoint 6 is planned as six backend tickets and one for the screens. The GeekyKey Service
    gets three new calls: who owns a token, claiming a token (3 at most for each user), and
    releasing one, by its owner or a GeekyKey admin. It also answers "too many requests" to a
    station or a user that sends too many in a minute. The screens then send their token calls to
    the service instead of using sample data, and the checkpoint ends with claims and releases on
    phones on production, a guest's included. Each request gets one 4-second deadline for all its
    calls to the claims stand-in, and the user limit counts only calls made after login. The
    trade-offs we accept: Cloudflare counts each limit separately in each of its data centres, so
    a sender can sometimes get past it, and the first limit waits for Julian to confirm its three
    IDs are free on GeeksHacking's account.

- id: token-lookup-says-who-owns-a-token
  date: 2026-10-22
  area: backend
  change: >-
    The GeekyKey Service can now tell the token page whether a token is unclaimed, the user's own,
    or someone else's, without naming the owner. A GeekyKey admin also gets the owner's user ID, to
    release the token with. Nothing calls it on production until the token page switches to it.
